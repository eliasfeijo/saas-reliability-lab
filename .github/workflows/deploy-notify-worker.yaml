name: Deploy Notify Worker

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'notify-worker/**'
      - '.github/workflows/deploy-notify-worker.yaml'

concurrency:
  group: deploy-notify-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: 'notify-worker/yarn.lock'

      - run: corepack enable

      - run: yarn install --frozen-lockfile
        working-directory: ./notify-worker

      - run: yarn deploy --keep-vars
        working-directory: ./notify-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
