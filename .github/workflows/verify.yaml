name: Verify Repository

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-tests:
    name: Flutter tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2.22.0
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - run: flutter pub get
        working-directory: ./flutter-app

      - run: flutter test
        working-directory: ./flutter-app

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: 'notify-worker/yarn.lock'

      - run: corepack enable

      - run: yarn install --frozen-lockfile
        working-directory: ./notify-worker

      - run: yarn test
        working-directory: ./notify-worker
