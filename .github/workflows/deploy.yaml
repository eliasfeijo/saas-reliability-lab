name: Deploy to GitHub Pages
on:
  push:
    branches:
      - master

concurrency:
  group: deploy-github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.22.0
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
      - uses: ./.github/actions/build-and-deploy-action
        with:
          workingDir: ./flutter-app
          baseHref: /saas-reliability-lab/
          customArgs: --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
